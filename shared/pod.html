<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>面试对练舱 · 1v1 语音对练</title>
<link rel="stylesheet" href="pod.css?v=20260728">
</head>
<body>
<div class="pod">
  <div class="pod-top">
    <div class="pod-title">🤝 面试对练舱</div>
    <div class="pod-conn" id="connState">未连接</div>
  </div>

  <!-- 落地：创建房间 -->
  <section id="landing" class="card center">
    <h2>1v1 极简面试对练</h2>
    <p class="muted">纯链接秒连 · 免注册 · P2P 语音直连</p>
    <button class="big-btn" id="createBtn">➕ 创建房间</button>
    <p class="hint">创建后把链接发给搭子，对方点开即连，2 秒内建立语音。</p>
  </section>

  <!-- 房间 -->
  <section id="room" class="card" style="display:none;">
    <div class="room-head">
      <div>
        <div class="room-label">房间号</div>
        <div class="room-no" id="roomNo">------</div>
      </div>
      <button class="mini-btn" id="copyBtn">📋 复制链接</button>
    </div>

    <div class="role-row" id="roleRow">
      <button class="role-btn" data-role="examiner">🎓 我要当考官</button>
      <button class="role-btn" data-role="candidate">🙋 我要当考生</button>
    </div>
    <div class="role-now" id="roleNow" style="display:none;"></div>

    <!-- 考生视图 -->
    <div id="candPanel" style="display:none;">
      <div class="block">
        <div class="block-t">当前题目（考官已发）</div>
        <div class="q-text" id="candQuestion">等待考官发题…</div>
      </div>
      <div class="block timer-block">
        <div class="block-t">演练倒计时</div>
        <div class="timer" id="candTimer">--:--</div>
      </div>
      <div class="block score-block">
        <div class="block-t">我的得分（考官实时评分）</div>
        <div class="score" id="candScore">100</div>
        <div class="score-deduct" id="candDeduct">暂无扣分</div>
      </div>
    </div>

    <!-- 考官视图 -->
    <div id="examPanel" style="display:none;">
      <div class="block">
        <div class="block-t">从题库选一题发给学生</div>
        <div class="sel-row">
          <select id="qSelect" class="sel"></select>
          <button class="mini-btn" id="sendQBtn">📤 发题</button>
        </div>
      </div>
      <div class="block">
        <div class="block-t">演练时长</div>
        <div class="dur-row" id="durRow">
          <button class="dur-btn active" data-d="180">3分钟</button>
          <button class="dur-btn" data-d="240">4分钟</button>
          <button class="dur-btn" data-d="300">5分钟</button>
        </div>
        <button class="big-btn start-btn" id="startBtn">▶ 开始演练</button>
        <button class="big-btn stop-btn" id="stopBtn" style="display:none;">■ 结束演练</button>
      </div>
      <div class="block">
        <div class="block-t">实时评分 Checklist（勾选即扣分）</div>
        <div id="checklist" class="checklist"></div>
        <div class="exam-score">考生当前得分：<b id="examScore">100</b></div>
      </div>
    </div>

    <!-- 语音 -->
    <div class="voice-row">
      <button class="mini-btn" id="micBtn">🎤 开启麦克风</button>
      <span class="voice-state" id="voiceState">未开启</span>
    </div>
    <audio id="remoteAudio" autoplay></audio>
    <audio id="localAudio" muted></audio>

    <div class="log" id="log"></div>
    <p class="hint" id="wxHint"></p>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="peerjs.min.js?v=20260728"></script>
<script src="pod.js?v=20260728"></script>
</body>
</html>
